<style>

      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <span class="av" style="width: 56px; height: 56px; font-size: 20px; background: #c4b5fd; box-shadow: 0 0 0 3px #0a0c0f, 0 0 0 5px #d69a6a">L</span>
        <span style="font-weight: 800; font-size: 15px">Luis</span>
        <span style="font-size: 13px; color: #d69a6a; font-weight: 700">9.800</span>
        <div style="width: 100%; height: 64px; border-radius: 14px 14px 4px 4px; background: #1b1f24; display: grid; place-items: center; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 30px; color: #d69a6a">3</div>
      </div>
    </section>

    <section style="border-radius: 20px; background: #14171b; border: 1px solid rgba(255,255,255,.07); overflow: hidden">
      <div class="row">
        <span style="width: 22px; text-align: center; font-weight: 800; color: #9ba3ad">4</span>
        <span class="av" style="background: #fdba74">C</span>

        <span style="font-size: 12px; font-weight: 700; color: #4ade80; display: inline-flex; align-items: center; gap: 3px"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5 21 19H3z"></path></svg>2</span>

        <span class="av" style="background: #86efac">S</span>
        <span style="flex: 1; font-weight: 700">Sara</span>
        <span style="font-size: 12px; font-weight: 700; color: #ff8a8a; display: inline-flex; align-items: center; gap: 3px"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 19 3 5h18z"></path></svg>1</span>

      <div class="row" style="border-bottom: 0">
        <span style="width: 22px; text-align: center; font-weight: 800; color: #9ba3ad">6</span>
        <span class="av" style="background: #fda4af">P</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">Pablo</span><span style="font-size: 12px; color: #ff8a8a; font-weight: 600">A cero · vuelve mañana con la paga</span></span>

        <span style="width: 64px; text-align: right; font-weight: 800">0</span>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: rgba(242,193,78,.08); border: 1px solid rgba(242,193,78,.25)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
      <p style="margin: 0; font-size: 14px; line-height: 1.4">Cierra el domingo a medianoche. Te faltan <b>2.750</b> para alcanzar a Ana.</p>

  <nav aria-label="Pestañas" style="display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 8px 28px; background: #0d1013; border-top: 1px solid rgba(255,255,255,.07)">

</div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f2c14e","options":["#f2c14e","#4ade80","#7dd3fc","#fb923c"]},"$preview":{"width":390,"height":1040}}'>
