<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Social · Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Fraunces:ital,opsz,wght@1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0c0f}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;min-height:44px;font-size:11px;font-weight:600;color:#8a929c;text-decoration:none}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0a0c0f;flex:none}
.seg{flex:1;min-height:40px;border-radius:10px;color:#9ba3ad;font-weight:700;font-size:15px;text-decoration:none}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.bub{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;background:#1b1f24}
.who{font-size:12px;font-weight:700;margin-bottom:3px}
.sys{align-self:center;font-size:12px;color:#9ba3ad;padding:6px 12px;border-radius:999px;background:#14171b;text-align:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0a0c0f; color: #f2f3f5; font-family: Manrope, system-ui, sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 54px 16px 12px">
    <button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: #14171b; color: #f2f3f5; font: inherit; font-weight: 700; font-size: 15px">
      Los del Curro
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <span style="font-size: 13px; color: #9ba3ad; display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80"></span>4 conectados</span>
  </header>

  <div style="padding: 6px 16px 10px">
    <div role="tablist" aria-label="Social" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #14171b">
      <a href="SocialFeed.dc.html" role="tab" aria-selected="false" class="seg" style="display: grid; place-items: center">Feed</a>
      <a href="SocialChat.dc.html" role="tab" aria-selected="true" class="seg" style="background: #262b31; color: #f2f3f5; display: grid; place-items: center">Chat</a>
    </div>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 12px; overflow: hidden; justify-content: flex-end">
    <span class="sys">Hoy</span>

    <div class="msg">
      <span class="av" style="background: #c4b5fd">L</span>
      <div><div class="who" style="color: #c4b5fd">Luis</div><div class="bub" style="border-bottom-left-radius: 6px">Blackjack a la primera, lo siento por el crupier</div></div>
    </div>

    <div class="msg">
      <span class="av" style="background: #fda4af">P</span>
      <div><div class="who" style="color: #fda4af">Pablo</div><div class="bub" style="border-bottom-left-radius: 6px">Yo he doblado con un 12. No me habléis</div></div>
    </div>

    <span class="sys">Pablo se ha quedado a cero</span>

    <div class="msg" style="align-self: flex-end">
      <div class="bub" style="background: {{accent}}; color: #1a1406; border-bottom-right-radius: 6px; font-weight: 600">Mañana te toca la paga, aguanta</div>
    </div>

    <div class="msg">
      <span class="av" style="background: #f2c14e">A</span>
      <div><div class="who" style="color: #f2c14e">Ana</div><div class="bub" style="border-bottom-left-radius: 6px">Marta, te saco 2.750. El domingo hablamos</div></div>
    </div>

    <div style="display: flex; gap: 6px; align-items: center; font-size: 12px; color: #9ba3ad; padding-left: 40px">
      <span style="display: inline-flex; gap: 3px" aria-hidden="true"><span style="width: 5px; height: 5px; border-radius: 50%; background: #9ba3ad"></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #9ba3ad; opacity: .7"></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #9ba3ad; opacity: .4"></span></span>
      Carlos está escribiendo
    </div>
  </main>

  <form style="display: flex; gap: 8px; padding: 8px 16px 12px; border-top: 1px solid rgba(255,255,255,.07)" onsubmit="return false">
    <label style="flex: 1; display: flex">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mensaje</span>
      <input type="text" placeholder="Escribe al grupo" style="flex: 1; min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: #14171b; color: #f2f3f5; font: inherit; font-size: 16px">
    </label>
    <button type="submit" aria-label="Enviar" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: {{accent}}; color: #1a1406; display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </form>

  <nav aria-label="Pestañas" style="display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 8px 28px; background: #0d1013; border-top: 1px solid rgba(255,255,255,.07)">
    <a href="Main.dc.html" class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Inicio
    </a>
    <a href="Ranking.dc.html" class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21V9h6v12M3 21v-7h6M15 21v-5h6v5M2 21h20"></path></svg>
      Ranking
    </a>
    <a href="#" class="tab" style="color: #f2f3f5">
      <span aria-hidden="true" style="width: 52px; height: 52px; margin-top: -22px; border-radius: 50%; background: repeating-conic-gradient(from 7.5deg, #16181c 0 30deg, {{accent}} 30deg 45deg); display: grid; place-items: center; box-shadow: 0 0 0 6px #0a0c0f, 0 8px 18px rgba(0,0,0,.55)">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a2e35, #16181c 70%); border: 2px dashed {{accent}}; box-sizing: border-box; display: grid; place-items: center; color: #f2f3f5; font-weight: 800; font-size: 16px; letter-spacing: -.02em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="16" rx="2"></rect><path d="M5.5 6.6 4 7.2a1 1 0 0 0-.6 1.3l3.7 10.6a1 1 0 0 0 1.3.6l3.4-1.2"></path></svg></span>
      </span>
      Jugar
    </a>
    <a href="SocialFeed.dc.html" class="tab" style="color: {{accent}}" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      Social
    </a>
    <a href="Perfil.dc.html" class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Perfil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f2c14e","options":["#f2c14e","#4ade80","#7dd3fc","#fb923c"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f2c14e' };
  }
}
</script>
</body>
</html>
