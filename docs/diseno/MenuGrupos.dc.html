<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú de grupos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Fraunces:ital,opsz,wght@1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0c0f}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;min-height:44px;font-size:11px;font-weight:600;color:#8a929c;text-decoration:none}
.ph{border-radius:20px;background:#14171b;border:1px solid rgba(255,255,255,.07)}
.it{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 12px;border:0;border-radius:14px;background:transparent;color:#f2f3f5;font:inherit;font-size:15px;font-weight:700;text-align:left;text-decoration:none;box-sizing:border-box}
.gi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0a0c0f;flex:none}
.rk{font-size:13px;font-weight:700;color:#9ba3ad;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0a0c0f; color: #f2f3f5; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 54px 16px 12px; position: relative; z-index: 3">
    <button type="button" aria-haspopup="true" aria-expanded="true" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{accent}}; background: #1b1f24; color: #f2f3f5; font: inherit; font-weight: 700; font-size: 15px">
      Los del Curro
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(180deg)"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #14171b; border: 1px solid rgba(255,255,255,.1); font-weight: 800; font-size: 15px; opacity: .4">
      <span style="width: 16px; height: 16px; border-radius: 50%; background: #f2c14e; box-shadow: inset 0 0 0 3px #c99a2e" aria-hidden="true"></span>
      240
    </div>
  </header>

  <main aria-hidden="true" style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 20px; opacity: .35; filter: blur(1px)">
    <div style="height: 30px; width: 60%; border-radius: 8px; background: #1b1f24"></div>
    <div class="ph" style="height: 210px; background: #0f5c35"></div>
    <div class="ph" style="height: 90px"></div>
    <div class="ph" style="height: 180px"></div>
  </main>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,8,.55); z-index: 1"></div>

  <div role="menu" aria-label="Tus grupos" style="position: absolute; z-index: 4; top: 104px; left: 12px; width: 300px; padding: 8px; border-radius: 22px; background: #1b1f24; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 60px rgba(0,0,0,.6)">
    <p style="margin: 8px 12px 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9ba3ad">Tus grupos</p>

    <button type="button" role="menuitemradio" aria-checked="true" class="it" style="background: #262b31">
      <span class="gi" style="background: {{accent}}">LC</span>
      <span style="flex: 1">Los del Curro<span style="display: block; font-size: 12px; font-weight: 600; color: #9ba3ad">2º de 6</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
    </button>
    <button type="button" role="menuitemradio" aria-checked="false" class="it">
      <span class="gi" style="background: #c4b5fd">F</span>
      <span style="flex: 1">Familia<span style="display: block; font-size: 12px; font-weight: 600; color: #9ba3ad">1º de 4</span></span>
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #f2c14e; color: #1a1406; display: grid; place-items: center" aria-label="Vas primera">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18 2 7l5 4 5-7 5 7 5-4-1 11z"></path></svg>
      </span>
    </button>
    <button type="button" role="menuitemradio" aria-checked="false" class="it">
      <span class="gi" style="background: #86efac">P</span>
      <span style="flex: 1">Pádel de los jueves<span style="display: block; font-size: 12px; font-weight: 600; color: #9ba3ad">5º de 8</span></span>
    </button>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 8px 4px">

    <a href="#" role="menuitem" class="it">
      <span class="gi" style="background: transparent; border: 1.5px dashed rgba(255,255,255,.25); color: #f2f3f5">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      Crear grupo
    </a>
    <a href="#" role="menuitem" class="it">
      <span class="gi" style="background: transparent; border: 1.5px dashed rgba(255,255,255,.25); color: #f2f3f5; font-size: 17px">#</span>
      Unirse con código
    </a>
    <a href="GrupoConfig.dc.html" role="menuitem" class="it" style="color: #d1d5db">
      <span class="gi" style="background: transparent; color: #d1d5db">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      </span>
      Ajustes de Los del Curro
    </a>
  </div>

  <nav aria-label="Pestañas" style="display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 8px 28px; background: #0d1013; border-top: 1px solid rgba(255,255,255,.07)">
    <a href="Main.dc.html" class="tab" style="color: {{accent}}" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Inicio
    </a>
    <a href="Ranking.dc.html" class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21V9h6v12M3 21v-7h6M15 21v-5h6v5M2 21h20"></path></svg>
      Ranking
    </a>
    <a href="#" class="tab" style="color: #f2f3f5">
      <span aria-hidden="true" style="width: 52px; height: 52px; margin-top: -22px; border-radius: 50%; background: repeating-conic-gradient(from 7.5deg, #16181c 0 30deg, {{accent}} 30deg 45deg); display: grid; place-items: center; box-shadow: 0 0 0 6px #0a0c0f, 0 8px 18px rgba(0,0,0,.55)">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a2e35, #16181c 70%); border: 2px dashed {{accent}}; box-sizing: border-box; display: grid; place-items: center; color: #f2f3f5; font-weight: 800; font-size: 16px; letter-spacing: -.02em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="16" rx="2"></rect><path d="M5.5 6.6 4 7.2a1 1 0 0 0-.6 1.3l3.7 10.6a1 1 0 0 0 1.3.6l3.4-1.2"></path></svg></span>
      </span>
      Jugar
    </a>
    <a href="SocialFeed.dc.html" class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      Social
    </a>
    <a href="Perfil.dc.html" class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Perfil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f2c14e","options":["#f2c14e","#4ade80","#7dd3fc","#fb923c"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f2c14e' };
  }
}
</script>
</body>
</html>
