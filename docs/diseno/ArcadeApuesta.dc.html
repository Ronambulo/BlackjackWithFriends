    <div style="display: flex; gap: 8px">

    <button type="button" aria-label="Ficha de 10" style="width: 60px; height: 60px; margin: 0 auto; box-sizing: border-box; border-radius: 50%; border: 6px dashed #fff; background: #4c7dff; color: #fff; font: 900 15px Rubik, sans-serif; box-shadow: 0 5px 0 #2e55c4">10</button>

    <button type="button" aria-label="Ficha de 500" style="width: 60px; height: 60px; margin: 0 auto; box-sizing: border-box; border-radius: 50%; border: 6px dashed #fff; background: #9b6bff; color: #fff; font: 900 15px Rubik, sans-serif; box-shadow: 0 5px 0 #6b42c9">500</button>
    <button type="button" aria-label="Ficha de 1000" disabled style="width: 60px; height: 60px; margin: 0 auto; box-sizing: border-box; border-radius: 50%; border: 6px dashed #3a4070; background: #232848; color: #5d6390; font: 900 15px Rubik, sans-serif">1K</button>

    <button type="button" style="flex: 2; height: 56px; border: 0; border-radius: 18px; background: #ffc83d; color: #2a1d00; font: 900 18px Rubik, sans-serif; box-shadow: 0 5px 0 #c48d0b">¡Repartir!</button>

  <!-- Floating dock -->
  <nav aria-label="Principal" style="margin: 6px 16px 20px; height: 64px; box-sizing: border-box; padding: 0 8px; border-radius: 22px; background: #232848; box-shadow: 0 4px 0 #0b0d1c; display: flex; align-items: center; justify-content: space-between">
    <a href="#" aria-label="Inicio" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #8e94c2">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path></svg>
    </a>
    <a href="#" aria-current="page" style="height: 48px; padding: 0 18px; border-radius: 16px; background: #ffc83d; color: #2a1d00; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 #c48d0b">

      Jugar

    <a href="#" aria-label="Social" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #8e94c2">

    </a>
