<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blackjack with Friends</title>
    <meta name="description" content="Juega al blackjack con tus amigos" />
    <meta name="theme-color" content="#0b6b3a" />
    <!--
      ?v=N: iOS caches the home screen icon per URL the first time someone taps
      "Añadir a pantalla de inicio" and never asks again, even if the file changes.
      Bump N whenever the icons change so Safari fetches them again.
    -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" />
    <link rel="icon" href="/icon.svg?v=4" type="image/svg+xml" />
    <!-- Filled in by vite.config.ts (inlined: iOS 27 fails to fetch it by URL). -->
    <link rel="apple-touch-icon" sizes="180x180" href="%APPLE_TOUCH_ICON%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blackjack" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
