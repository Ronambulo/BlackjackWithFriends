; Dos procesos, un único contenedor. entrypoint.sh exporta DATABASE_PATH,
; BETTER_AUTH_SECRET y BETTER_AUTH_URL antes de arrancar supervisord, así que los
; programas de abajo las heredan.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; La API: solo accesible desde dentro del contenedor. Aplica las migraciones al arrancar.
[program:api]
command=node /app/backend/dist/server.js
directory=/app/backend
environment=HOST="127.0.0.1",PORT="3001"
priority=20
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; La web: lo único que se publica. Docker pone HOSTNAME al id del contenedor, y
; Next escucharía solo ahí; 0.0.0.0 lo abre a todas las interfaces.
[program:web]
command=node /app/web/frontend/server.js
directory=/app/web/frontend
environment=HOSTNAME="0.0.0.0"
priority=30
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
